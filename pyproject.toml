[project]
name = "psychic-flow"
version = "0.1.0"
description = "本地优先的招聘简历智能筛选工作台"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "openai>=1.50,<3",
  "httpx[socks]>=0.27,<1",
  "pymupdf>=1.24,<2",
  "python-docx>=1.1,<2",
  "mammoth>=1.8,<2",
  "bleach>=6.1,<7",
  "pytesseract>=0.3.13,<1",
  "pillow>=10,<13",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
