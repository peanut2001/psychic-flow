# 项目已更名为 psychic-flow，但 Compose 项目名、数据库与数据卷沿用 hireflow：
# 固定 name 后无论仓库目录叫什么都使用同一个数据卷，改名会导致已有数据「消失」。
name: hireflow

services:
  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://hireflow:hireflow@db:5432/hireflow
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hireflow
      POSTGRES_USER: hireflow
      POSTGRES_PASSWORD: hireflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireflow -d hireflow"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - hireflow-postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  hireflow-postgres:
